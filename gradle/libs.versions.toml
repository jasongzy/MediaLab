[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose = "2026.09.00"
material3 = "1.5.0-beta01"
activity = "1.13.0"
lifecycle = "2.11.0"
appcompat = "1.8.0"
litert = "2.3.0"
qnn-runtime = "2.51.0"
junit = "4.13.2"
exifinterface = "1.4.2"
taglib = "1.0.6"
media3 = "1.11.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
litert-gpu = { module = "com.google.ai.edge.litert:litert-gpu", version.ref = "litert" }
litert-qualcomm = { module = "com.google.ai.edge.litert:litert-npu-runtime-qualcomm", version.ref = "litert" }
qnn-runtime = { module = "com.qualcomm.qti:qnn-runtime", version.ref = "qnn-runtime" }
junit = { module = "junit:junit", version.ref = "junit" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
taglib = { module = "io.github.kyant0:taglib", version.ref = "taglib" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
